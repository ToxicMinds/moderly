name: Build RecompOS APK

# Builds the single native RecompOS Android app: a thin Capacitor shell that
# loads the live web app from Vercel (so UI/logic updates arrive over the air
# with no reinstall) and adds the Health Connect plugin for OnePlus Watch data.
# You only need to reinstall this APK when NATIVE bits change (plugins, config) —
# everyday updates come straight from Vercel.

on:
  push:
    branches: [main]
    paths:
      - "svelte-recomp/capacitor.config.json"
      - "svelte-recomp/android/**"
      - ".github/workflows/build-app-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svelte-recomp
    env:
      # Public, non-secret values (URL + publishable key). Only used so the
      # offline-fallback bundle builds; the real app is served from Vercel.
      PUBLIC_SUPABASE_URL: https://jerbhsasccvjelkkphgu.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_H8G1aDyFJFLmgxrTc8qKeA_kxyXRLyk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list starts with "tools", a package Google has
          # since removed from the SDK repository, and sdkmanager fails on it
          # before the build starts. Gradle fetches the platform it needs.
          packages: platform-tools

      - name: Install JS dependencies
        run: npm ci

      - name: Build static web bundle (Capacitor target)
        run: BUILD_TARGET=capacitor npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # The signing key used to be committed to this PUBLIC repo with its
      # password in build.gradle, which let anyone sign an APK that Android
      # would accept as an in-place update to com.toxicminds.recompos — on an
      # app that ships its own APK installer. It now lives only in repository
      # secrets and is written to a path outside the workspace, so it cannot be
      # picked up by an artifact upload or a stray `git add`.
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set — the APK would be signed with a throwaway key and could not update any installed app."
            exit 1
          fi
          mkdir -p "$HOME/.recompos"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$HOME/.recompos/recompos.keystore"
          chmod 600 "$HOME/.recompos/recompos.keystore"

      - name: Build debug APK
        working-directory: svelte-recomp/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/../.recompos/recompos.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          export ANDROID_KEYSTORE_FILE="$HOME/.recompos/recompos.keystore"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Shred the keystore
        if: always()
        run: rm -f "$HOME/.recompos/recompos.keystore"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk recompos.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: recompos-apk
          path: svelte-recomp/recompos.apk
          if-no-files-found: error

      - name: Publish to a Release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: recompos-app-latest
          name: RecompOS (Android app)
          body: |
            The full RecompOS app as a native Android APK.
            It loads the live app from Vercel (updates arrive automatically — no
            reinstall) and adds OnePlus Watch health data via Health Connect.

            Install once, sign in, grant Health Connect permissions. You only need
            to reinstall when this release changes (native updates).
          files: svelte-recomp/recompos.apk
          fail_on_unmatched_files: true
