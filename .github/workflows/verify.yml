# Every push runs the whole baseline again, away from the laptop it was
# written on (ENGINEERING.md). It verifies only; deploys go through
# svelte-recomp/scripts/ship.sh.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: svelte-recomp
    env:
      # The two public values the build bakes in. This job never deploys, so
      # stand-ins do.
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-stand-in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: svelte-recomp/package-lock.json
      - run: npm ci
      - run: npm run verify
      - name: The baseline in the repo is the one that ran
        run: git diff --exit-code -- scripts/baseline.txt
