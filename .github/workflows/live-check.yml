# The live site, every three hours, away from the laptop that deploys it:
# every address on the same build, a commit on main; the pages people land on;
# the first screen running in a browser at a phone's size; the edge functions
# answering (svelte-recomp/scripts/smoke.mjs, the same check ship.sh runs after
# each deploy). A failed run emails the repo owner: GitHub's own notice.
name: Live check

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live:
    # The image's own Google Chrome (SMOKE_CHROME): nothing to download.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: svelte-recomp
    env:
      # Public: it is in every page the app serves.
      PUBLIC_SUPABASE_URL: https://jerbhsasccvjelkkphgu.supabase.co
      SMOKE_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: svelte-recomp/package-lock.json
      - run: npm ci
      - run: node scripts/smoke.mjs
